version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - gosec
    - misspell
    - revive
    - unconvert
    - unparam
  settings:
    misspell:
      locale: UK
      # NO_COLOR and Go's own APIs, such as color.Color, are spelt the US way.
      ignore-rules:
        - color
    revive:
      rules:
        - name: exported
          disabled: true
  exclusions:
    rules:
      # Tests and the test harness start subprocesses on purpose.
      - path: (_test\.go|internal/termtest/)
        linters:
          - gosec

formatters:
  enable:
    - gofmt
