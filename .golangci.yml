version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - gosec
    - misspell
    - revive
    - unconvert
    - unparam
  settings:
    misspell:
      locale: UK
    revive:
      rules:
        - name: exported
          disabled: true
  exclusions:
    rules:
      # Tests start subprocesses and write fixtures on purpose.
      - path: _test\.go
        linters:
          - gosec

formatters:
  enable:
    - gofmt
